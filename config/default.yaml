dataset_params:
  im_path: 'data/images/train'
  im_test_path: 'data/images/test2'
  mask_test_path: 'data/mask/test2'

diffusion_params:
  num_timesteps : 50
  beta_start : 0.0001
  beta_end : 0.02

model_params:
  im_channels : 1
  im_size : 28
  down_channels : [32, 64, 128, 256]
  mid_channels : [256, 256, 128]
  down_sample : [True, True, False]
  time_emb_dim : 128
  num_down_layers : 2
  num_mid_layers : 2
  num_up_layers : 2
  num_heads : 4

train_params:
  task_name: 'small_timeSteps_test'
  batch_size: 64
  num_epochs: 20
  num_samples : 100
  num_grid_rows : 10
  lr: 0.01
  ckpt_name: 'ddpm_ckpt_smallTimeSteps.pth'
